import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'de.mannodermaus.android-junit5'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'com.rohitjakhar.ratingdialog'
    compileSdk 34
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding = true
    }

    kotlin {
        jvmToolchain 17
    }

}

def junitVersion = "5.10.0"

dependencies {
    api project(':core')
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'com.google.android.play:review:2.0.1'
    implementation 'com.google.android.play:review-ktx:2.0.1'

    implementation("io.coil-kt:coil:2.7.0")

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-params:$junitVersion"
    testImplementation 'org.assertj:assertj-core:3.23.1'
    testImplementation 'io.mockk:mockk:1.12.7'
}

mavenPublishing {
    coordinates("io.github.rohitjakhar.ratingdialog", "library", "0.0.2")
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    pom {
        name = "Awesome App Dialog"
        description = "A description of what my library does."
        inceptionYear = "2024"
        url = "https://github.com/rohitjakhar/awesome-app-rating/"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "rohitjakhar"
                name = "Rohit Jakhar"
                url = "https://github.com/rohitjakhar/"
            }
        }
        scm {
            url = "https://github.com/rohitjakhar/awesome-app-rating/"
            connection = "scm:git:git://github.com/rohitjakhar/awesome-app-rating.git"
            developerConnection = "scm:git:ssh://git@github.com/rohitjakhar/awesome-app-rating.git"
        }
    }
}
